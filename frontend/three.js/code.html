<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_1 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_1" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_1');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js interactive 3D Globe with orbiting satellite, glowing telemetry rings, and particle stars
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 8.5);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Starfield particles
const starCount = 600;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i += 3) {
  starPos[i] = (Math.random() - 0.5) * 35;
  starPos[i + 1] = (Math.random() - 0.5) * 35;
  starPos[i + 2] = (Math.random() - 0.5) * 20 - 5;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({
  color: 0x38bdf8,
  size: 0.04,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// Central Wireframe Hologram Globe
const globeGroup = new THREE.Group();
scene.add(globeGroup);

// Main sphere body (dark with faint cyan glow)
const sphereGeo = new THREE.SphereGeometry(2.4, 36, 36);
const sphereMat = new THREE.MeshBasicMaterial({
  color: 0x061528,
  transparent: true,
  opacity: 0.85
});
const baseSphere = new THREE.Mesh(sphereGeo, sphereMat);
globeGroup.add(baseSphere);

// Wireframe cage
const wireMat = new THREE.MeshBasicMaterial({
  color: 0x00f0ff,
  wireframe: true,
  transparent: true,
  opacity: 0.22
});
const wireGlobe = new THREE.Mesh(sphereGeo, wireMat);
globeGroup.add(wireGlobe);

// Latitude / Longitude accent rings
const ring1Geo = new THREE.RingGeometry(2.7, 2.74, 64);
const ring1Mat = new THREE.MeshBasicMaterial({
  color: 0x00f0ff,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.45
});
const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
ring1.rotation.x = Math.PI / 2.3;
globeGroup.add(ring1);

const ring2Geo = new THREE.RingGeometry(3.1, 3.12, 64);
const ring2Mat = new THREE.MeshBasicMaterial({
  color: 0x38bdf8,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.3
});
const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
ring2.rotation.x = Math.PI / 1.7;
ring2.rotation.y = Math.PI / 4;
globeGroup.add(ring2);

// Orbiting Satellite Object
const satPivot = new THREE.Group();
scene.add(satPivot);

const satBodyGeo = new THREE.BoxGeometry(0.2, 0.12, 0.35);
const satBodyMat = new THREE.MeshBasicMaterial({ color: 0xe2e8f0 });
const satBody = new THREE.Mesh(satBodyGeo, satBodyMat);

// Solar panels
const panelGeo = new THREE.BoxGeometry(0.7, 0.02, 0.22);
const panelMat = new THREE.MeshBasicMaterial({ color: 0x00b8d9 });
const leftPanel = new THREE.Mesh(panelGeo, panelMat);
leftPanel.position.x = 0.45;
const rightPanel = new THREE.Mesh(panelGeo, panelMat);
rightPanel.position.x = -0.45;

// Satellite sensor beam / radar dish
const dishGeo = new THREE.ConeGeometry(0.12, 0.2, 16);
const dishMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true });
const dish = new THREE.Mesh(dishGeo, dishMat);
dish.position.y = -0.15;
dish.rotation.x = Math.PI;

const satellite = new THREE.Group();
satellite.add(satBody);
satellite.add(leftPanel);
satellite.add(rightPanel);
satellite.add(dish);

// Position satellite along orbit
satellite.position.set(3.4, 0.5, 0);
satPivot.add(satellite);
satPivot.rotation.z = 0.35;
satPivot.rotation.x = 0.45;

// Subtle orbit trail ring
const orbitTrackGeo = new THREE.RingGeometry(3.38, 3.41, 96);
const orbitTrackMat = new THREE.MeshBasicMaterial({
  color: 0x00f0ff,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.18
});
const orbitTrack = new THREE.Mesh(orbitTrackGeo, orbitTrackMat);
satPivot.add(orbitTrack);

// Mouse interaction
let mouseX = 0;
let mouseY = 0;
const onMouseMove = (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 0.4;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 0.4;
};
window.addEventListener('mousemove', onMouseMove);

const onResize = () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
};
window.addEventListener('resize', onResize);

// Animation Loop
let reqId;
const animate = () => {
  reqId = requestAnimationFrame(animate);

  globeGroup.rotation.y += 0.003;
  globeGroup.rotation.x = mouseY * 0.5;
  globeGroup.rotation.y += mouseX * 0.01;

  satPivot.rotation.y += 0.012;
  stars.rotation.y -= 0.0005;

  renderer.render(scene, camera);
};
animate();

return () => {
  cancelAnimationFrame(reqId);
  window.removeEventListener('mousemove', onMouseMove);
  window.removeEventListener('resize', onResize);
  renderer.dispose();
};

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_1 -->
</body>
</html>
